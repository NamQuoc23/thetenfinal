<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Champion Mindset · THE FINAL TEN</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-hero mindset-hero">
      <div class="wrap wrap--mid">
        <p class="eyebrow">THE FINAL TEN</p>
        <h1>The Champion Mindset</h1>
        <p>Một góc nhỏ để giữ lại những video cần xem vào những ngày lười ra khỏi nhà, hoặc những ngày đôi chân quên mất mình đã hứa gì.</p>
      </div>
    </section>

    <section class="section-cream" style="padding-top:0">
      <div class="wrap wrap--mid">
        <div class="mindset-add-card">
          <div>
            <h2>Thêm video</h2>
            <p>Dán link YouTube vào đây. Video sẽ được lưu trên trình duyệt đang dùng.</p>
          </div>
          <form id="video-form" class="mindset-form">
            <input id="video-title" type="text" placeholder="Tên video, ví dụ: Không bỏ buổi hôm nay" />
            <input id="video-url" type="url" placeholder="https://www.youtube.com/watch?v=..." required />
            <button class="btn btn-primary" type="submit">Thêm vào playlist</button>
          </form>
          <p class="form-message" id="video-message" style="display:none"></p>
        </div>

        <div id="featured-video" class="featured-video"></div>

        <div class="mindset-section-title">
          <h2>Playlist</h2>
          <p>Những thứ xem trước khi xỏ giày.</p>
        </div>
        <div class="video-grid" id="video-grid"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/mindset.js"></script>
</body>
</html>
