<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiến độ · THE FINAL TEN</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .chart { margin-top: 24px; display: flex; align-items: flex-end; gap: 10px; height: 180px; }
    .chart .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .chart .bar { width: 100%; max-width: 34px; background: var(--forest); border-radius: 4px 4px 0 0; }
    .chart .bar.right { background: var(--race-red); }
    .chart .lbl { margin-top: 8px; font-size: 10px; color: var(--earth); }
    .chart-legend { display:flex; gap:20px; margin-top:16px; font-size:13px; color: var(--earth); }
    .legend-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
    .test-history-row { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid rgba(107,74,50,0.15); font-size:14px; }
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="wrap wrap--mid">
        <h1 id="page-title"></h1>
        <p id="page-lead"></p>
      </div>
    </section>

    <section class="section-cream" style="padding-top:0">
      <div class="wrap wrap--mid">
        <div class="runner-card">
          <h3 style="margin-bottom:4px">QUÃNG ĐƯỜNG THEO TUẦN</h3>
          <div class="chart" id="km-chart"></div>
          <div class="chart-legend" id="chart-legend"></div>
        </div>

        <div style="margin-top:32px" class="dual-grid" id="progress-stats"></div>

        <div style="margin-top:32px" class="runner-card">
          <h3 style="margin-bottom:8px">LỊCH SỬ BÀI TEST</h3>
          <div id="test-history"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/progress.js"></script>
</body>
</html>
