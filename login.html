<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE FINAL TEN · Đăng nhập</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <p class="eyebrow" style="text-align:center">THE FINAL TEN · ROAD TO 27.12</p>
      <h1 class="login-title">NGÀY HẸN ĐÃ ĐƯỢC VIẾT.<br />ĐOẠN KẾT THÌ CHƯA.</h1>
      <p class="login-sub">Mười cây số cuối cùng của năm không được quyết định ở vạch xuất phát.<br />Nó được quyết định trong những ngày không ai nhìn thấy.</p>
      <div class="login-grid" id="runner-picker"></div>
    </div>
  </main>
  <audio id="login-music" src="assets/audio/login-music.mp3" preload="auto" autoplay playsinline></audio>
  <button class="login-music-toggle" id="login-music-toggle" type="button" hidden>NHẠC</button>

  <script type="module">
    import { getRunners, setCurrentRunnerId, seedDemoDataIfEmpty } from "./js/store.js";

    seedDemoDataIfEmpty();

    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "index.html";

    const picker = document.getElementById("runner-picker");
    const loginMusic = document.getElementById("login-music");
    const loginMusicToggle = document.getElementById("login-music-toggle");
    loginMusic.volume = 0.65;

    const playLoginMusic = () => {
      loginMusic.play()
        .then(() => {
          loginMusicToggle.hidden = true;
        })
        .catch(() => {
          loginMusicToggle.hidden = false;
        });
    };

    playLoginMusic();
    window.addEventListener("pointerdown", playLoginMusic, { once: true });
    window.addEventListener("keydown", playLoginMusic, { once: true });
    loginMusicToggle.addEventListener("click", playLoginMusic);

    for (const r of getRunners()) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "login-btn";
      btn.innerHTML = `<span class="name">${r.full_name.toUpperCase()}</span><span class="hint">VIẾT TIẾP</span>`;
      btn.addEventListener("click", () => {
        setCurrentRunnerId(r.id);
        location.href = next;
      });
      picker.appendChild(btn);
    }
  </script>
</body>
</html>
