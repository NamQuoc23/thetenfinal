<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE FINAL TEN · Đăng nhập</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login-wrap">
    <button type="button" id="sound-toggle" class="sound-toggle" aria-label="Tắt/mở nhạc nền">🔊</button>
    <div class="login-card">
      <p class="eyebrow" style="text-align:center">THE FINAL TEN · ROAD TO 27.12</p>
      <h1 class="login-title">NGÀY HẸN ĐÃ ĐƯỢC VIẾT.<br />ĐOẠN KẾT THÌ CHƯA.</h1>
      <p class="login-sub">Mười cây số cuối cùng của năm không được quyết định ở vạch xuất phát.<br />Nó được quyết định trong những ngày không ai nhìn thấy.</p>
      <div class="login-grid" id="runner-picker"></div>
    </div>
  </main>

  <audio id="login-audio" src="assets/audio/login-music.mp3" preload="none" loop></audio>

  <script type="module">
    import { getRunners, setCurrentRunnerId, seedDemoDataIfEmpty } from "./js/store.js";

    seedDemoDataIfEmpty();

    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "index.html";

    const picker = document.getElementById("runner-picker");
    for (const r of getRunners()) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "login-btn";
      btn.innerHTML = `<span class="name">${r.full_name.toUpperCase()}</span><span class="hint">VIẾT TIẾP</span>`;
      btn.addEventListener("click", () => {
        setCurrentRunnerId(r.id);
        location.href = next;
      });
      picker.appendChild(btn);
    }

    // Nhạc nền: cố tự phát; nếu trình duyệt chặn, bắt đầu ngay lần tương tác đầu tiên.
    const audio = document.getElementById("login-audio");
    const soundToggle = document.getElementById("sound-toggle");
    let userMuted = false;

    function updateToggleIcon() {
      soundToggle.textContent = audio.paused || userMuted ? "🔈" : "🔊";
    }

    function tryPlay() {
      if (userMuted) return;
      audio.play().then(updateToggleIcon).catch(() => {
        updateToggleIcon();
      });
    }

    tryPlay();
    document.addEventListener("click", tryPlay, { once: true });

    soundToggle.addEventListener("click", () => {
      if (audio.paused) {
        userMuted = false;
        tryPlay();
      } else {
        audio.pause();
        userMuted = true;
        updateToggleIcon();
      }
    });

    updateToggleIcon();
  </script>
</body>
</html>
